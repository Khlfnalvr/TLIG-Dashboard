# Build TLIG Dashboard on a Windows runner.
#
# The project is WinUI 3 targeting net10.0-windows, so it cannot be compiled
# anywhere but Windows — this is what lets a change be verified without waiting
# for someone to open Visual Studio on the lab PC.
#
# Both flavors are built: Server and Client come from one codebase but differ by
# compile constant, and several files carry #if CLIENT blocks, so a change can
# break one flavor while the other still compiles.
#
# Deliberately NOT run on every branch: it only fires for the claude/** working
# branches and on manual dispatch, so it does not spend Actions minutes on
# unrelated pushes. Windows runners bill at a higher rate than Linux ones.

name: Build

on:
  push:
    branches: [ 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false        # report BOTH flavors, not just the first to fail
      matrix:
        flavor: [ Server, Client ]

    name: ${{ matrix.flavor }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore TLIGDashboard.csproj -p:Flavor=${{ matrix.flavor }}

      - name: Build
        run: >
          dotnet build TLIGDashboard.csproj
          --no-restore
          -c Release
          -p:Flavor=${{ matrix.flavor }}
          -warnaserror:NU1605
