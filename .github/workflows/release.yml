# Publish a TLIG Dashboard release.
#
# Dijalankan manual dari tab Actions. Mengikuti prosedur yang sudah ada di repo
# (release.ps1 + installer_server.iss / installer_client.iss) supaya nama asetnya
# persis seperti yang dicari UpdateService:
#
#   TLIGDashboard-<Flavor>-v<VERSION>-Setup.exe
#   TLIGDashboard-<Flavor>-v<VERSION>-Update.zip
#
# Versinya dibaca dari <Version> di TLIGDashboard.csproj -- satu sumber kebenaran,
# jadi tidak ada peluang tag dan isi biner berbeda versi.

name: Release

on:
  # Jalur utama: dorong tag v* dan rilis terbit dari commit yang ditandai itu.
  push:
    tags: [ 'v*' ]
  # Jalur cadangan, kalau perlu menerbitkan tanpa membuat tag lebih dulu.
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Terbitkan sebagai prerelease (hanya PC Early Access yang menerimanya)'
        type: boolean
        default: false

permissions:
  contents: write        # membuat tag + release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content TLIGDashboard.csproj
          $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw 'Version tidak ditemukan di TLIGDashboard.csproj' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versi: $v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # release.ps1 mengerjakan semuanya: dotnet publish dua flavor, membuat
      # Update ZIP, lalu mengompilasi kedua installer lewat ISCC.
      - name: Build release artifacts
        shell: pwsh
        run: .\release.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $expected = @(
            "TLIGDashboard-Server-v$v-Setup.exe",
            "TLIGDashboard-Server-v$v-Update.zip",
            "TLIGDashboard-Client-v$v-Setup.exe",
            "TLIGDashboard-Client-v$v-Update.zip"
          )
          foreach ($name in $expected) {
            $f = Join-Path 'publish' $name
            if (-not (Test-Path $f)) { throw "Aset hilang: $name" }
            $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
            Write-Host "OK  $name  ($mb MB)"
          }
          # PIDtest.py harus ikut terbawa, kalau tidak tombol RUN di PC tujuan
          # tidak punya jembatan untuk dijalankan ke LabVIEW.
          foreach ($flavor in @('Server','Client')) {
            $py = Join-Path "publish/$flavor" 'PIDtest.py'
            if (-not (Test-Path $py)) { throw "PIDtest.py tidak ada di publish/$flavor" }
            if (-not (Select-String -Path $py -Pattern '>dddddd' -Quiet)) {
              throw "PIDtest.py di publish/$flavor masih versi 32 byte"
            }
            Write-Host "OK  publish/$flavor/PIDtest.py  (48 byte / 6 double)"
          }

      - name: Write release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = @(
            '## PENTING: tombol JALANKAN dan BERHENTI berubah perilakunya di versi ini',
            '',
            'Plant Heat Exchanger sekarang hanya bisa dipegang SATU ORANG pada satu waktu.',
            'Baca bagian ini sebelum memasang -- praktikum yang sedang berjalan ikut',
            'terpengaruh.',
            '',
            '- JALANKAN tidak lagi selalu langsung menjalankan plant. Kalau plant sedang',
            '  dipakai orang lain, tombol itu memasukkan Anda ke ANTRIAN, dan TIDAK ADA',
            '  perintah apa pun yang dikirim ke LabVIEW.',
            '- BERHENTI sekarang juga MELEPAS GILIRAN, sehingga antrean berikutnya bisa',
            '  mulai. RESET dan E-STOP tetap tidak melepas giliran.',
            '- Giliran MAHASISWA dibatasi 30 MENIT, dihitung sejak gilirannya diberikan.',
            '  Kalau habis, Server mengirim BERHENTI ke plant LEBIH DULU, baru memindahkan',
            '  gilirannya ke orang berikutnya. Dosen, Asisten, dan Admin tidak dibatasi.',
            '- Menutup aplikasi atau logout selagi memegang kendali juga melepas giliran,',
            '  juga dengan BERHENTI lebih dulu.',
            '',
            'Urutannya sengaja selalu sama: hentikan rig dulu, baru lepas giliran. Kalau',
            'perintah berhentinya gagal sampai, pemutusan otomatis SENGAJA tidak melepas',
            'giliran -- rig yang mungkin masih panas tidak diserahkan diam-diam ke mahasiswa',
            'berikutnya. Dosen/Asisten bisa mencabut paksa sebagai jalan keluarnya.',
            '',
            'Percobaan yang terpotong TETAP TERSIMPAN lengkap dengan kurvanya, ditandai',
            'status Terputus. Tidak ada data praktikum yang hilang karena pemutusan ini.',
            '',
            'VI LabVIEW TIDAK perlu diubah. Tidak ada perubahan pada paket 48 byte, pada',
            'format baris CSV, maupun pada urutan kolomnya. Perintah berhentinya memakai',
            'paket yang sama persis dengan tombol BERHENTI di layar.',
            '',
            '## Yang baru di versi ini',
            '',
            '### Antrian giliran plant HE',
            '',
            '- Strip status antrian di kartu Control: plant sedang dipakai siapa, sudah',
            '  berapa lama, Anda di antrean ke berapa, dan sisa waktu giliran Anda.',
            '- Urutan giliran menurut peran: Admin -> Dosen/Asisten -> Mahasiswa, dan di',
            '  dalam tingkat yang sama siapa yang lebih dulu meminta, dia yang lebih dulu',
            '  dilayani. Peran yang lebih tinggi bisa mengambil alih; yang diambil alih',
            '  kembali ke antrian di posisi terdepan tingkatnya.',
            '- Pemberitahuan di bagian atas jendela: giliran tiba, sisa waktu 5 menit dan',
            '  1 menit, dan giliran yang berakhir bukan atas kehendak sendiri. Muncul di',
            '  halaman mana pun Anda berada.',
            '- Penolakan JALANKAN menyebut siapa pemegangnya, perannya, sudah berapa lama,',
            '  dan posisi antrean Anda.',
            '- Tombol Cabut paksa untuk Dosen, Asisten, dan Admin. Berbeda dengan pemutusan',
            '  otomatis, cabut paksa tetap melepas giliran walau plant gagal dihentikan, dan',
            '  layar memberi tahu stafnya kalau rig mungkin masih menyala.',
            '- Halaman Users mendapat kolom Antrian plant yang menyegarkan diri sendiri.',
            '',
            '### Hasil percobaan tersimpan dan bisa dibaca lagi',
            '',
            '- Kombinasi Setpoint/Kp/Ki/Kd/Bukaan Valve yang sama tidak dijalankan ulang di',
            '  plant; hasilnya diambil dari database, lengkap dengan kurva responsnya yang',
            '  digambar ke chart, kapan dijalankan, dan oleh siapa. Ada tombol Tetap',
            '  jalankan di plant kalau memang ingin mengulang (mis. alat baru dikalibrasi).',
            '- Halaman Riwayat (staf): riwayat percobaan dan riwayat antrian, dengan ekspor',
            '  CSV dan kurva satu percobaan yang bisa dibuka lalu diekspor per titik waktu.',
            '- Challenge Learning (mahasiswa): tabel Riwayat Percobaan Saya beserta tombol',
            '  Ekspor CSV. Isinya hanya percobaan milik sendiri -- penyaringannya dikerjakan',
            '  Server dari identitas login, bukan oleh aplikasi di komputer mahasiswa.',
            '',
            '### Siapa yang perlu update',
            '',
            'PC SERVER DAN SEMUA LAPTOP CLIENT. Berbeda dengan v1.0.6 yang cukup di Server,',
            'kali ini keduanya harus dipasang: Server menegakkan antriannya, dan Client versi',
            'lama tidak mengenali jawaban "sedang dipakai orang lain" sehingga tombol',
            'JALANKAN-nya akan terlihat gagal tanpa keterangan apa-apa.',
            '',
            '### Cara memasang',
            '',
            "- Pemasangan baru: unduh TLIGDashboard-Server-v$v-Setup.exe untuk PC Server dan",
            "  TLIGDashboard-Client-v$v-Setup.exe untuk laptop mahasiswa.",
            '- Sudah terpasang: buka aplikasi, tombol notifikasi pembaruan akan muncul',
            '  sendiri. Pembaruan tidak dipasang diam-diam, harus diklik dulu.',
            '',
            'Kalau perlu mundur, pasang kembali installer v1.0.6 -- rilis itu tetap ada',
            'beserta seluruh asetnya. Database antrian dan riwayat percobaan dibuat terpisah',
            'dari data lama, jadi memasang kembali versi lama tidak menghapus apa pun.'
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $pre = '${{ inputs.prerelease }}' -eq 'true'
          $ghArgs = @(
            'release','create',"v$v",
            "publish/TLIGDashboard-Server-v$v-Setup.exe#Installer Server",
            "publish/TLIGDashboard-Client-v$v-Setup.exe#Installer Client",
            "publish/TLIGDashboard-Server-v$v-Update.zip#Update Package Server",
            "publish/TLIGDashboard-Client-v$v-Update.zip#Update Package Client",
            '--title', "Version $v",
            '--notes-file', 'release-notes.md'
          )
          # Saat dipicu tag, tag-nya sudah ada dan gh memakainya apa adanya.
          # Saat dispatch manual, tag belum ada sehingga sasarannya perlu disebut.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ghArgs += @('--target', $env:GITHUB_SHA)
          }
          if ($pre) { $ghArgs += '--prerelease' }

          # Tag harus sepadan dengan <Version> di csproj, kalau tidak PC yang
          # sudah terpasang akan membandingkan versi yang salah.
          $tagRef = $env:GITHUB_REF
          if ($tagRef -like 'refs/tags/*') {
            $tag = $tagRef -replace '^refs/tags/', ''
            if ($tag -ne "v$v") {
              throw "Tag $tag tidak cocok dengan versi di csproj (v$v). Selaraskan dulu."
            }
          }
          # Rilis bisa saja sudah dibuat lebih dulu lewat halaman Releases di
          # browser (itu cara membuat tag tanpa terminal). Kalau begitu, jangan
          # gagal -- cukup unggah asetnya ke rilis yang sudah ada dan perbarui
          # judul serta catatannya, supaya kedua cara sama-sama berakhir benar.
          $existing = gh release view "v$v" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release v$v sudah ada -- mengunggah aset ke sana."
            gh release upload "v$v" `
              "publish/TLIGDashboard-Server-v$v-Setup.exe#Installer Server" `
              "publish/TLIGDashboard-Client-v$v-Setup.exe#Installer Client" `
              "publish/TLIGDashboard-Server-v$v-Update.zip#Update Package Server" `
              "publish/TLIGDashboard-Client-v$v-Update.zip#Update Package Client" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Gagal mengunggah aset ke rilis v$v" }
            gh release edit "v$v" --title "Version $v" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Gagal memperbarui catatan rilis v$v" }
          } else {
            gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "Gagal membuat rilis v$v" }
          }
          Write-Host "Release v$v siap (prerelease: $pre)"
