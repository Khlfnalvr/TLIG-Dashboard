# Publish a TLIG Dashboard release.
#
# Dijalankan manual dari tab Actions. Mengikuti prosedur yang sudah ada di repo
# (release.ps1 + installer_server.iss / installer_client.iss) supaya nama asetnya
# persis seperti yang dicari UpdateService:
#
#   TLIGDashboard-<Flavor>-v<VERSION>-Setup.exe
#   TLIGDashboard-<Flavor>-v<VERSION>-Update.zip
#
# Versinya dibaca dari <Version> di TLIGDashboard.csproj -- satu sumber kebenaran,
# jadi tidak ada peluang tag dan isi biner berbeda versi.

name: Release

on:
  # Jalur utama: dorong tag v* dan rilis terbit dari commit yang ditandai itu.
  push:
    tags: [ 'v*' ]
  # Jalur cadangan, kalau perlu menerbitkan tanpa membuat tag lebih dulu.
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Terbitkan sebagai prerelease (hanya PC Early Access yang menerimanya)'
        type: boolean
        default: false

permissions:
  contents: write        # membuat tag + release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content TLIGDashboard.csproj
          $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          if (-not $v) { throw 'Version tidak ditemukan di TLIGDashboard.csproj' }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versi: $v"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # release.ps1 mengerjakan semuanya: dotnet publish dua flavor, membuat
      # Update ZIP, lalu mengompilasi kedua installer lewat ISCC.
      - name: Build release artifacts
        shell: pwsh
        run: .\release.ps1

      - name: Verify artifacts
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $expected = @(
            "TLIGDashboard-Server-v$v-Setup.exe",
            "TLIGDashboard-Server-v$v-Update.zip",
            "TLIGDashboard-Client-v$v-Setup.exe",
            "TLIGDashboard-Client-v$v-Update.zip"
          )
          foreach ($name in $expected) {
            $f = Join-Path 'publish' $name
            if (-not (Test-Path $f)) { throw "Aset hilang: $name" }
            $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
            Write-Host "OK  $name  ($mb MB)"
          }
          # PIDtest.py harus ikut terbawa, kalau tidak tombol RUN di PC tujuan
          # tidak punya jembatan untuk dijalankan ke LabVIEW.
          foreach ($flavor in @('Server','Client')) {
            $py = Join-Path "publish/$flavor" 'PIDtest.py'
            if (-not (Test-Path $py)) { throw "PIDtest.py tidak ada di publish/$flavor" }
            if (-not (Select-String -Path $py -Pattern '>dddddd' -Quiet)) {
              throw "PIDtest.py di publish/$flavor masih versi 32 byte"
            }
            Write-Host "OK  publish/$flavor/PIDtest.py  (48 byte / 6 double)"
          }

      - name: Write release notes
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = @(
            '## Angka LabVIEW kini ikut terlihat di dashboard Client',
            '',
            'Selama ini kartu LabVIEW Data -- Flow Tube, PV, Flow Shell, Temp. Shell out --',
            'hanya ada di dashboard yang berjalan di PC lab. Mahasiswa yang memakai laptop',
            'sendiri tidak bisa melihat angkanya sama sekali.',
            '',
            '### Penyebabnya',
            '',
            'VI LabVIEW membuka koneksinya ke 127.0.0.1:6001, alamat loopback. Hanya dashboard',
            'yang berjalan di PC yang sama dengan VI yang bisa berada di jalur itu, jadi listener',
            'milik laptop mahasiswa selamanya sepi. Ini tidak bisa diperbaiki dengan mengubah',
            'port atau IP di Client.',
            '',
            '### Perbaikannya',
            '',
            'Server sekarang menyediakan satu alamat baca-saja (GET /hmi/latest) berisi angka',
            'terkini yang ia terima dari VI. Client menanyakannya sekali per detik, jadi angka',
            'di laptop mengikuti PC lab dengan jeda di bawah dua detik.',
            '',
            'Polanya sama dengan progres live yang sudah ada di v1.0.8: Server membaca keadaan',
            'lokalnya, Client memakai jawabannya apa adanya.',
            '',
            '### Siapa yang melihat angkanya',
            '',
            'Bukan semua orang, dan penyaringannya dikerjakan Server dari identitas login --',
            'bukan oleh aplikasi di laptop, jadi tidak ada permintaan yang bisa diubah untuk',
            'menembusnya.',
            '',
            '- Dosen, Asisten, dan Admin: SELALU melihat, di laptop mana pun. Mereka pengawas,',
            '  dan sulit mengambil langkah tanpa melihat suhu rig.',
            '- Mahasiswa: HANYA saat dirinya sendiri yang sedang memegang giliran. Yang',
            '  mengantre, yang gilirannya habis kena batas 30 menit, dan yang kendalinya',
            '  dicabut sama-sama berhenti melihat angkanya.',
            '',
            'Mahasiswa yang belum gilirannya tetap melihat kartunya, dengan keterangan bahwa',
            'angka akan muncul saat gilirannya tiba -- kartunya tidak hilang timbul.',
            '',
            'Kalau VI dimatikan atau angkanya berhenti mengalir, kartu di Client berkata',
            '"Tidak tersambung" dan MENGOSONGKAN angkanya, bukan memajang nilai lama yang diam.',
            '',
            'Kartunya muncul di dua halaman Client: Dashboard dan Live View.',
            '',
            '### Yang TIDAK berubah',
            '',
            'Dashboard PC lab tidak berubah sedikit pun, termasuk perilaku kartunya saat VI',
            'dimatikan. Jalur valve/PID (paket 48 byte port 6000, PIDtest.py, pid_bridge.json)',
            'tidak disentuh. Logika antrian giliran tidak disentuh. Tidak ada teks lama yang',
            'berubah, tidak ada tombol yang pindah, dan bentuk database tidak berubah sama',
            'sekali. VI LabVIEW juga tidak perlu diubah.',
            '',
            '### Siapa yang perlu update',
            '',
            'PC SERVER DAN LAPTOP CLIENT, keduanya. Alamat baru itu ada di Server, jadi Client',
            'v1.0.9 yang menyambung ke Server v1.0.8 akan menampilkan kartu yang berkata server',
            'tidak terjangkau. Client v1.0.8 yang menyambung ke Server v1.0.9 tidak rusak --',
            'kartunya saja yang tetap tersembunyi seperti sebelumnya.',
            '',
            '### Cara memasang',
            '',
            "- Pemasangan baru: unduh TLIGDashboard-Server-v$v-Setup.exe untuk PC lab dan",
            "  TLIGDashboard-Client-v$v-Setup.exe untuk laptop mahasiswa.",
            '- Sudah terpasang: buka aplikasi, tombol notifikasi pembaruan akan muncul sendiri.',
            '  Pembaruan tidak dipasang diam-diam, harus diklik dulu.',
            '',
            'Kalau perlu mundur, pasang kembali installer v1.0.8 -- rilis itu tetap ada beserta',
            'seluruh asetnya, dan karena bentuk database tidak berubah, tidak ada data yang',
            'hilang saat mundur.'
          )
          Set-Content -Path release-notes.md -Value $lines -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $pre = '${{ inputs.prerelease }}' -eq 'true'
          $ghArgs = @(
            'release','create',"v$v",
            "publish/TLIGDashboard-Server-v$v-Setup.exe#Installer Server",
            "publish/TLIGDashboard-Client-v$v-Setup.exe#Installer Client",
            "publish/TLIGDashboard-Server-v$v-Update.zip#Update Package Server",
            "publish/TLIGDashboard-Client-v$v-Update.zip#Update Package Client",
            '--title', "Version $v",
            '--notes-file', 'release-notes.md'
          )
          # Saat dipicu tag, tag-nya sudah ada dan gh memakainya apa adanya.
          # Saat dispatch manual, tag belum ada sehingga sasarannya perlu disebut.
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ghArgs += @('--target', $env:GITHUB_SHA)
          }
          if ($pre) { $ghArgs += '--prerelease' }

          # Tag harus sepadan dengan <Version> di csproj, kalau tidak PC yang
          # sudah terpasang akan membandingkan versi yang salah.
          $tagRef = $env:GITHUB_REF
          if ($tagRef -like 'refs/tags/*') {
            $tag = $tagRef -replace '^refs/tags/', ''
            if ($tag -ne "v$v") {
              throw "Tag $tag tidak cocok dengan versi di csproj (v$v). Selaraskan dulu."
            }
          }
          # Rilis bisa saja sudah dibuat lebih dulu lewat halaman Releases di
          # browser (itu cara membuat tag tanpa terminal). Kalau begitu, jangan
          # gagal -- cukup unggah asetnya ke rilis yang sudah ada dan perbarui
          # judul serta catatannya, supaya kedua cara sama-sama berakhir benar.
          $existing = gh release view "v$v" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            Write-Host "Release v$v sudah ada -- mengunggah aset ke sana."
            gh release upload "v$v" `
              "publish/TLIGDashboard-Server-v$v-Setup.exe#Installer Server" `
              "publish/TLIGDashboard-Client-v$v-Setup.exe#Installer Client" `
              "publish/TLIGDashboard-Server-v$v-Update.zip#Update Package Server" `
              "publish/TLIGDashboard-Client-v$v-Update.zip#Update Package Client" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Gagal mengunggah aset ke rilis v$v" }
            gh release edit "v$v" --title "Version $v" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Gagal memperbarui catatan rilis v$v" }
          } else {
            gh @ghArgs
            if ($LASTEXITCODE -ne 0) { throw "Gagal membuat rilis v$v" }
          }
          Write-Host "Release v$v siap (prerelease: $pre)"
